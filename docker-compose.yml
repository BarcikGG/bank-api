services:
  bank-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${BANK_DB_PASSWORD:?Set BANK_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - bank-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 3s
      timeout: 3s
      retries: 20

  notifications-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - notifications-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:19092
      --create
      --if-not-exists
      --topic bank.events.v1
      --partitions 6
      --replication-factor 1

  bank-api:
    build:
      context: ./services/bank
    command: ["/app/bank-api"]
    environment:
      ENV: local
      HOST: 0.0.0.0
      PORT: 8080
      TIMEOUT: 10s
      IDLE_TIMEOUT: 60s
      DATABASE_URL: "postgres://bank:${BANK_DB_PASSWORD:?Set BANK_DB_PASSWORD in .env}@bank-db:5432/bank?sslmode=disable"
      JWT_SECRET: ${BANK_JWT_SECRET:?Set BANK_JWT_SECRET in .env}
      JWT_TTL: 15m
      REFRESH_TTL: 720h
    ports:
      - "8080:8080"
    depends_on:
      bank-db:
        condition: service_healthy

  bank-outbox-relay:
    build:
      context: ./services/bank
    command: ["/app/outbox-relay"]
    environment:
      DATABASE_URL: "postgres://bank:${BANK_DB_PASSWORD:?Set BANK_DB_PASSWORD in .env}@bank-db:5432/bank?sslmode=disable"
      KAFKA_BROKERS: kafka:19092
      OUTBOX_BATCH_SIZE: 10
      OUTBOX_POLL_INTERVAL: 500ms
      OUTBOX_LEASE: 120s
    depends_on:
      bank-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notifications-consumer:
    build:
      context: ./services/notifications
    command: ["/app/notifications-consumer"]
    environment:
      DATABASE_URL: "postgres://notifications:${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}@notifications-db:5432/notifications?sslmode=disable"
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: bank.events.v1
      KAFKA_CONSUMER_GROUP: notifications-v1
    depends_on:
      notifications-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notifications-worker:
    build:
      context: ./services/notifications
    command: ["/app/notifications-worker"]
    environment:
      DATABASE_URL: "postgres://notifications:${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}@notifications-db:5432/notifications?sslmode=disable"
      NOTIFICATION_BATCH_SIZE: 10
      NOTIFICATION_POLL_INTERVAL: 500ms
      NOTIFICATION_LEASE: 120s
      DELIVERY_TIMEOUT: 10s
    depends_on:
      notifications-db:
        condition: service_healthy

volumes:
  bank-db-data:
  notifications-db-data:
  kafka-data:
